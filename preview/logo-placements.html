<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>DIA Park — Logo Placements Preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    /* Brand */
    --dia-green-50:  #E8F5EE;
    --dia-green-100: #C5E6D2;
    --dia-green-200: #95D1AE;
    --dia-green-300: #5FB987;
    --dia-green-400: #3FBC7E;
    --dia-green-500: #1FA168;
    --dia-green-600: #15824F;
    --dia-green-700: #136A41;
    --dia-green-800: #0A2E1F;
    --dia-green-900: #051A12;

    /* Neutrals */
    --neutral-0:   #FFFFFF;
    --neutral-50:  #FAFBFA;
    --neutral-100: #F2F4F2;
    --neutral-200: #E5E8E6;
    --neutral-300: #DFE3E1;
    --neutral-400: #C8CEC9;
    --neutral-500: #9AA39D;
    --neutral-600: #6C7570;
    --neutral-700: #4A524D;
    --neutral-800: #2A302D;
    --neutral-900: #1A1F1C;

    /* Status */
    --status-success-bg:  #DEF5E8;
    --status-warning-bg:  #FDF5DC;
    --status-warning-main:#D89614;
    --status-danger-bg:   #FDE3E6;
    --status-danger-main: #D7263D;
    --status-info-bg:     #E1ECFC;
    --status-info-main:   #1E6FE0;

    --font-sans:    'Inter', system-ui, sans-serif;
    --font-display: 'Bricolage Grotesque', 'Inter', sans-serif;
    --font-mono:    'JetBrains Mono', monospace;
  }
  html, body { font-family: var(--font-sans); background: #F5F6F4; }
  .font-display { font-family: var(--font-display); }
  .font-mono    { font-family: var(--font-mono); }
</style>
</head>
<body>
<div id="root"></div>

<!-- Design canvas host -->
<script type="text/babel" src="design-canvas.jsx"></script>

<!-- Login artboard -->
<script type="text/babel">
window.LoginArtboard = function LoginArtboard() {
  return (
    <div className="flex w-full h-full overflow-hidden" style={{ background: 'var(--neutral-50)' }}>
      {/* Left: brand panel */}
      <div className="relative flex-1 overflow-hidden" style={{
        background: 'linear-gradient(135deg, #0A2E1F 0%, #136A41 50%, #15824F 100%)'
      }}>
        {/* grid overlay */}
        <div className="absolute inset-0" style={{
          opacity: 0.05,
          backgroundImage: 'linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px)',
          backgroundSize: '32px 32px'
        }}/>
        {/* watermark logo */}
        <img src="dia-holding.png" alt="" aria-hidden="true"
          className="absolute -bottom-16 -right-10 w-[420px] h-[420px] select-none pointer-events-none"
          style={{ opacity: 0.09, filter: 'brightness(2.5) contrast(0.6)' }} />

        <div className="relative z-10 flex flex-col h-full p-12">
          {/* Logo header */}
          <div className="flex items-center gap-3">
            <img src="dia-holding.png" alt="DIA Holding"
              className="w-11 h-11 rounded-lg shrink-0"
              style={{ boxShadow: '0 2px 12px rgba(0,0,0,.25)' }} />
            <div className="flex flex-col leading-none">
              <span className="text-white font-display font-semibold tracking-wide text-sm">DIA HOLDING</span>

          </div>

          <div className="flex-1 flex flex-col justify-center max-w-md">
            <h1 className="font-display text-white text-[44px] font-semibold leading-[1.1] tracking-tight mb-4">
              Управляйте<br/>объектами<br/>осознанно.
            </h1>
            <p className="text-white/70 text-base leading-relaxed mb-10">
              Единый портал для управляющих, технической службы и резидентов DIA Park.
            </p>
            <div className="flex items-center gap-3">
              <div className="flex -space-x-2">
                {['#3FBC7E','#15824F','#D89614'].map((c,i)=>(
                  <div key={i} className="w-8 h-8 rounded-full border-2 border-[#0A2E1F]" style={{background:c}}/>
                ))}
              </div>
              <span className="text-white/60 text-sm">38 сотрудников онлайн</span>
            </div>
          </div>

          <div className="font-mono text-[10px] tracking-widest uppercase" style={{ color: 'rgba(255,255,255,.4)' }}>
            © 2026 DIA Holding · Almaty
          </div>
        </div>
      </div>

      {/* Right: form */}
      <div className="w-[480px] flex flex-col bg-white">

          <div className="w-full max-w-sm">
            <div className="mb-8">
              <div className="flex items-center gap-3 mb-6">
                <img src="dia-holding.png" alt="" className="w-9 h-9 rounded-md"/>
                <span className="font-display font-semibold tracking-wide text-sm" style={{color:'var(--dia-green-700)'}}>DIA PARK · Башня А</span>
              </div>
              <h2 className="font-display text-3xl font-semibold tracking-tight" style={{color:'var(--neutral-900)'}}>С возвращением</h2>
              <p className="text-sm mt-2" style={{color:'var(--neutral-600)'}}>Войдите, чтобы продолжить работу с порталом</p>

            <div className="space-y-4">
              <div className="relative">
                <div className="absolute left-3 top-1/2 -translate-y-1/2" style={{color:'var(--neutral-500)'}}>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                </div>
                <input placeholder="manager@diapark.kz" className="h-12 pl-11 pr-4 w-full border rounded-lg outline-none transition-all"
                  style={{background:'var(--neutral-50)',borderColor:'var(--neutral-300)',color:'var(--neutral-900)'}}/>
              </div>
              <div className="relative">
                <div className="absolute left-3 top-1/2 -translate-y-1/2" style={{color:'var(--neutral-500)'}}>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </div>
                <input type="password" placeholder="••••••••" className="h-12 pl-11 pr-4 w-full border rounded-lg outline-none"
                  style={{background:'var(--neutral-50)',borderColor:'var(--neutral-300)',color:'var(--neutral-900)'}}/>
              </div>
              <button className="w-full h-12 rounded-lg text-white text-base font-medium transition-all"
                style={{background:'var(--dia-green-600)', boxShadow:'0 2px 8px rgba(21,130,79,.25)'}}>
                Войти
              </button>
              <div className="flex items-center gap-4 py-1">
                <div className="flex-1 h-px" style={{background:'var(--neutral-300)'}}/>
                <span className="text-xs uppercase tracking-wider" style={{color:'var(--neutral-500)'}}>или</span>
                <div className="flex-1 h-px" style={{background:'var(--neutral-300)'}}/>
              </div>
              <button className="w-full h-12 rounded-lg border text-base font-medium"
                style={{borderColor:'var(--neutral-300)', color:'var(--neutral-900)'}}>
                Войти через Google
              </button>
            </div>
          </div>
        </div>
        <div className="p-6 text-center font-mono text-xs tracking-wide" style={{color:'var(--neutral-500)'}}>
          DIA PARK · v1.0 · 2026
        </div>
      </div>
    </div>
  );

</script>

<!-- Sidebar artboard -->
<script type="text/babel">
window.SidebarArtboard = function SidebarArtboard() {
  const nav = [
    { label: 'Дашборд', icon: '◧', active: true },
    { label: 'Заявки и задачи', icon: '☑', badge: 12 },
    { label: 'Коммуникация', icon: '💬', badge: 3 },
    { label: 'Смены и журнал', icon: '⏱' },
    { label: 'Резиденты', icon: '👥' },
    { label: 'Финансы', icon: '₸' },
    { label: 'Тех. служба', icon: '🔧' },
    { label: 'Клининг', icon: '🧹' },
    { label: 'Охрана', icon: '🛡' },
    { label: 'ИИ-аналитика', icon: '✦' },
    { label: 'Документы', icon: '📄' },
  ];
  return (
    <div className="flex w-full h-full" style={{background:'var(--neutral-50)'}}>
      {/* Sidebar */}
      <aside className="w-[260px] h-full flex flex-col shrink-0" style={{background:'var(--neutral-0)', borderRight:'1px solid var(--neutral-200)'}}>
        <div className="flex items-center gap-3 px-5 h-16 shrink-0" style={{borderBottom:'1px solid var(--neutral-200)'}}>
          <img src="dia-holding.png" alt="DIA Holding"
            className="w-9 h-9 rounded-md shrink-0 object-cover"
            style={{ boxShadow: '0 1px 2px rgba(15,102,64,0.12)' }} />
          <div className="flex flex-col leading-none">
            <span className="text-sm font-display font-semibold tracking-tight" style={{color:'var(--neutral-900)'}}>DIA Park</span>
            <span className="text-[10px] mt-0.5" style={{color:'var(--neutral-500)'}}>Корпоративный портал</span>
          </div>
        </div>

        {/* Object switcher */}
        <div className="px-3 pt-3">
          <button className="w-full flex items-center justify-between gap-2 px-3 py-2.5 rounded-lg" style={{background:'var(--neutral-50)', border:'1px solid var(--neutral-200)'}}>
            <div className="flex items-center gap-2.5">
              <div className="w-7 h-7 rounded-md flex items-center justify-center font-display text-xs font-bold text-white" style={{background:'var(--dia-green-600)'}}>А</div>
              <div className="flex flex-col leading-none text-left">
                <span className="text-[11px] uppercase tracking-wider" style={{color:'var(--neutral-500)'}}>объект</span>
                <span className="text-sm font-medium mt-0.5" style={{color:'var(--neutral-900)'}}>Башня А</span>
              </div>
            </div>
            <span style={{color:'var(--neutral-500)'}}>⌄</span>
          </button>
        </div>

        <nav className="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto">
          {nav.map((it, i) => (
            <div key={i}
              className={`flex items-center gap-3 px-3 py-2 rounded-lg text-sm cursor-pointer transition-colors ${it.active ? '' : 'hover:bg-[var(--neutral-50)]'}`}
              style={it.active ? {background:'var(--dia-green-50)', color:'var(--dia-green-700)'} : {color:'var(--neutral-700)'}}>
              <span className="w-4 text-center text-base">{it.icon}</span>
              <span className="flex-1 font-medium">{it.label}</span>
              {it.badge && <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full text-white" style={{background:'var(--status-danger-main)'}}>{it.badge}</span>}
            </div>
          ))}
        </nav>

        <div className="px-3 py-3" style={{borderTop:'1px solid var(--neutral-200)'}}>
          <div className="flex items-center gap-2.5 px-2 py-2 rounded-lg" style={{background:'var(--neutral-50)'}}>
            <div className="w-8 h-8 rounded-full flex items-center justify-center font-display text-xs font-bold text-white" style={{background:'var(--dia-green-700)'}}>АК</div>
            <div className="flex flex-col leading-none flex-1">
              <span className="text-xs font-medium" style={{color:'var(--neutral-900)'}}>Азамат Кенжебеков</span>
              <span className="text-[10px] mt-0.5" style={{color:'var(--neutral-500)'}}>Управляющий</span>
            </div>
          </div>
        </div>
      </aside>

      {/* Page content preview */}
      <div className="flex-1 flex flex-col" style={{background:'var(--neutral-50)'}}>
        <div className="h-16 px-6 flex items-center" style={{background:'var(--neutral-0)', borderBottom:'1px solid var(--neutral-200)'}}>
          <span className="text-sm" style={{color:'var(--neutral-600)'}}>Главная / <span style={{color:'var(--neutral-900)'}}>Дашборд</span></span>
        </div>
        <div className="flex-1 p-6">
          <h2 className="font-display text-2xl font-semibold mb-1" style={{color:'var(--neutral-900)'}}>Доброе утро, Азамат</h2>
          <p className="text-sm" style={{color:'var(--neutral-600)'}}>Сегодня 23 мая, в портале 12 активных заявок и 3 непрочитанных сообщения.</p>
        </div>
      </div>
    </div>
  );
};
</script>

<!-- Analytics hero -->
<script type="text/babel">
window.AnalyticsHero = function AnalyticsHero() {
  return (
    <div className="w-full h-full flex flex-col" style={{background:'var(--neutral-50)'}}>
      <div className="relative overflow-hidden" style={{background:'linear-gradient(135deg, #0A2E1F 0%, #136A41 50%, #15824F 100%)'}}>
        <div className="absolute inset-0" style={{opacity:.04, backgroundImage:'linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px, transparent 1px)', backgroundSize:'32px 32px'}}/>
        <img src="dia-holding.png" alt="" aria-hidden="true"
          className="absolute -right-8 -top-8 w-[280px] h-[280px] select-none pointer-events-none"
          style={{opacity:.08, filter:'brightness(2) saturate(.5)'}} />
        <div className="relative px-8 py-12">
          <div className="flex items-start justify-between mb-8">
            <div>
              <div className="flex items-center gap-3 mb-3">
                <div className="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center">✦</div>
                <h1 className="font-display text-3xl font-semibold text-white tracking-tight">ИИ-аналитика</h1>
              </div>

            </div>
            <div className="text-right">
              <div className="flex items-center gap-2 text-white/40 text-sm mb-1">⏱ Обновлено 22 мая 14:32</div>
              <div className="font-mono text-xs text-white/30">Анализ 2 847 событий</div>
            </div>
          </div>

          <div className="bg-white/10 backdrop-blur-sm rounded-2xl p-1.5 border border-white/10">
            <div className="flex items-center gap-3 px-4 py-3">
              <span className="text-white/50">✦</span>
              <input placeholder="Спросите у ИИ..." className="flex-1 bg-transparent text-white placeholder:text-white/40 outline-none text-base"/>
              <button className="bg-white rounded-lg px-4 py-2 text-sm font-medium" style={{color:'var(--dia-green-700)'}}>Отправить</button>
            </div>
            <div className="flex gap-2 px-4 pb-3 flex-wrap">
              {['Какие расходы выросли за месяц?','Кто чаще просрочивает оплату?','Какие заявки повторяются?','Прогноз доходов на июнь'].map((c,i)=>(
                <span key={i} className="px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-white/70 text-sm">{c}</span>
              ))}
            </div>
          </div>
        </div>
      </div>
      <div className="flex-1 p-8" />
    </div>
  );

</script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function App() {
  return (
    <DesignCanvas title="DIA Park · Логотип в действии" subtitle="Места, где появляется фирменный знак — Sidebar, экран входа, заголовок ИИ-аналитики.">
      <DCSection id="brand" title="Брендирование разделов">
        <DCArtboard id="login" label="Login · 1440 × 900" width={1440} height={900}>
          <LoginArtboard/>
        </DCArtboard>
        <DCArtboard id="sidebar" label="Sidebar + Top · 1280 × 800" width={1280} height={800}>
          <SidebarArtboard/>
        </DCArtboard>
        <DCArtboard id="analytics" label="ИИ-аналитика · hero · 1280 × 600" width={1280} height={600}>
          <AnalyticsHero/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
